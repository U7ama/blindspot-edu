<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#701a24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#701a24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="page-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="page-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="64" height="64" rx="16" fill="#120d14"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#701a24" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Subtle core ambient glow -->
  <circle cx="32" cy="32" r="18" fill="url(#core-glow)" opacity="0.65"/>

  <!-- Golden Beacon / Enlightenment Ray -->
  <path d="M32 11L35.5 25L32 29L28.5 25Z" fill="url(#gold-grad)"/>
  <circle cx="32" cy="10.5" r="2.5" fill="#fef08a"/>
  <circle cx="32" cy="10.5" r="4.5" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Left Book Page -->
  <path d="M31 28C25 24 18 25 13 28V45C18 42 25 41 31 45V28Z" fill="url(#page-left)"/>
  <path d="M31 31C26 28 20 29 15 31V46C20 44 26 43 31 47V31Z" fill="#701a24" opacity="0.25"/>

  <!-- Right Book Page -->
  <path d="M33 28C39 24 46 25 51 28V45C46 42 39 41 33 45V28Z" fill="url(#page-right)"/>
  <path d="M33 31C38 28 44 29 49 31V46C44 44 38 43 33 47V31Z" fill="#701a24" opacity="0.25"/>

  <!-- Book Spine Center Divider -->
  <line x1="32" y1="27" x2="32" y2="46" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkles -->
  <path d="M19 18L20 21L23 22L20 23L19 26L18 23L15 22L18 21Z" fill="#fbbf24" opacity="0.85"/>
  <path d="M45 17L46 19.5L48.5 20.5L46 21.5L45 24L44 21.5L41.5 20.5L44 19.5Z" fill="#fbbf24" opacity="0.85"/>
</svg>
